<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rol-Ficha</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #17171c;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app {
            width: 90%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 40px;
        }

        .system {
            background: #24242c;
            border: 1px solid #3b3b47;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .system h2 {
            margin-top: 0;
        }

        button {
            background: #ffffff;
            color: #17171c;
            border: none;
            border-radius: 10px;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

    <div class="app">

        <h1>Rol-Ficha</h1>

        <p class="subtitle">
            Fichas de personaje y sistema de tiradas
        </p>

        <div class="system">
            <h2>🎲 Sistema de pruebas</h2>

            <p>
                Nuestro primer sistema de rol.
            </p>

            <button onclick="alert('¡Sistema seleccionado!')">
                Entrar
            </button>
        </div>

        <div class="system">
            <h2>➕ Nuevo sistema</h2>

            <p>
                Próximamente podremos añadir otros sistemas.
            </p>

        </div>

    </div>

</body>
</html>
